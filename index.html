  <script>
    // ── Cookie helper ──
    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : '';
    }

    // ── URL parameter helper ──
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name) || '';
    }

    // ── Safe fbq ──
    function safeFbq() {
      try {
        if (typeof fbq === 'function') {
          fbq.apply(null, arguments);
        }
      } catch(e) {}
    }

    // ── Send event data to Make Webhook for CAPI ──
    function sendCAPIEvent(eventName, contentName) {
      try {
        var fbclid = getParam('fbclid');
        var fbp = getCookie('_fbp');
        var fbc = getCookie('_fbc');

        if (!fbc && fbclid) {
          fbc = 'fb.1.' + Date.now() + '.' + fbclid;
        }

        var payload = {
          event_name: eventName,
          event_time: Math.floor(Date.now() / 1000),
          event_source_url: window.location.href,
          action_source: 'website',
          content_name: contentName,
          user_data: {
            client_user_agent: navigator.userAgent,
            fbc: fbc || '',
            fbp: fbp || '',
            fbclid: fbclid || ''
          }
        };

        var webhookUrl = 'https://hook.us2.make.com/3jvo4tgiqetar6onruly12a8asfmpjt';

        // 修正ポイント: navigator.sendBeacon から fetch に変更
        // credentials: 'omit' を指定することでCORSの制限（Wildcard '*' issues）を回避します
        fetch(webhookUrl, {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit', 
          body: JSON.stringify(payload),
          headers: {
            'Content-Type': 'application/json'
          }
        }).catch(function(err) {
          // エラーが発生してもユーザーの体験を阻害しないよう、ログのみ出力
          console.warn('CAPI transmission failed:', err);
        });

      } catch(e) {
        // Silently fail
      }
    }

    // ── Button handlers ──
    function handleLineClick(e) {
      e.preventDefault();
      safeFbq('track', 'Lead', {content_name: 'LINE登録_モニターキャンペーン'});
      sendCAPIEvent('Lead', 'LINE登録_モニターキャンペーン');
      var url = 'https://liff.line.me/1657615313-pVn9wnwB?rid=161';
      setTimeout(function() {
        window.location.href = url;
      }, 400);
    }

    function handleWebClick(e) {
      e.preventDefault();
      safeFbq('track', 'Schedule', {content_name: 'WEB予約_モニターキャンペーン'});
      sendCAPIEvent('Schedule', 'WEB予約_モニターキャンペーン');
      var url = 'https://connect-app.net/r_leticia/reserve/main';
      setTimeout(function() {
        window.open(url, '_blank', 'noopener');
      }, 400);
    }

    // ── Send PageView CAPI event on page load ──
    document.addEventListener('DOMContentLoaded', function() {
      sendCAPIEvent('PageView', 'クッションページ閲覧');
    });
  </script>
