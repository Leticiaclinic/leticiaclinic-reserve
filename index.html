<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>症例モニター医師カウンセリング｜レティシアクリニック</title>

  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window,document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '872763425811626');
    fbq('track', 'PageView');
  </script>

  <script>
    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : '';
    }

    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name) || '';
    }

    function safeFbq() {
      try { if (typeof fbq === 'function') fbq.apply(null, arguments); } catch(e) {}
    }

    function sendCAPIEvent(eventName, contentName) {
      try {
        var fbclid = getParam('fbclid');
        var fbp = getCookie('_fbp');
        var fbc = getCookie('_fbc') || (fbclid ? 'fb.1.' + Date.now() + '.' + fbclid : '');

        var payload = {
          event_name: eventName,
          event_time: Math.floor(Date.now() / 1000),
          event_source_url: window.location.href,
          action_source: 'website',
          content_name: contentName,
          user_data: {
            client_user_agent: navigator.userAgent,
            fbc: fbc, fbp: fbp, fbclid: fbclid
          }
        };

        // 【最新のURLに更新済み】
        var webhookUrl = 'https://hook.us2.make.com/3jvo4tgiqetar6onruly12a8asfmpjbz';

        fetch(webhookUrl, {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit', 
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(function(err) { console.warn('CAPI error:', err); });
      } catch(e) {}
    }

    function handleLineClick(e) {
      e.preventDefault();
      safeFbq('track', 'Lead', {content_name: 'LINE登録_モニターキャンペーン'});
      sendCAPIEvent('Lead', 'LINE登録_モニターキャンペーン');
      setTimeout(function() { window.location.href = 'https://liff.line.me/1657615313-pVn9wnwB?rid=161'; }, 400);
    }

    function handleWebClick(e) {
      e.preventDefault();
      safeFbq('track', 'Schedule', {content_name: 'WEB予約_モニターキャンペーン'});
      sendCAPIEvent('Schedule', 'WEB予約_モニターキャンペーン');
      setTimeout(function() { window.open('https://connect-app.net/r_leticia/reserve/main', '_blank', 'noopener'); }, 400);
    }

    document.addEventListener('DOMContentLoaded', function() {
      sendCAPIEvent('PageView', 'クッションページ閲覧');
    });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0908;--surface:#131110;--surface2:#1c1916;--gold:#c9a96e;--text:#f0ebe3;--text-muted:#8a7d6e;--border:rgba(201,169,110,0.18);--radius:14px}
    body{background:var(--bg);font-family:'Noto Serif JP',serif;color:var(--text);line-height:1.6}
    .hero{width:100%;height:45vh;position:relative;overflow:hidden}
    .hero-img{width:100%;height:100%;object-fit:cover;filter:brightness(0.7)}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,var(--bg) 100%)}
    .hero-content{position:absolute;top:55%;left:0;right:0;text-align:center;padding:0 20px}
    .hero-en{font-family:'Cormorant Garamond',serif;font-size:28px;letter-spacing:0.2em;color:var(--gold)}
    .main{max-width:500px;margin:0 auto;padding:20px}
    .campaign-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:25px;text-align:center;margin-bottom:25px}
    .campaign-card strong{color:var(--gold);font-size:1.2em}
    .btn{display:flex;align-items:center;justify-content:center;padding:16px;border-radius:var(--radius);text-decoration:none;margin-bottom:12px;transition:0.3s;font-weight:500}
    .btn-line{background:#06c755;color:#fff}.btn-web{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
    .pricing-item{display:flex;justify-content:space-between;padding:12px;background:var(--surface);border-radius:10px;margin-bottom:8px;border:1px solid rgba(201,169,110,0.08)}
    .pricing-price{color:var(--gold);font-family:'Cormorant Garamond',serif}
    .reveal{opacity:0;transform:translateY(20px);transition:0.8s}.reveal.visible{opacity:1;transform:translateY(0)}
  </style>
</head>
<body>
<div class="hero">
  <img src="https://leticiaclinic.github.io/leticiaclinic-reserve/11.jpg" class="hero-img">
  <div class="hero-overlay"></div>
  <div class="hero-content"><p class="hero-en">Leticia Clinic</p></div>
</div>
<div class="main">
  <div class="campaign-card reveal"><p>美容外科医歴25年の治療が<br><strong>最大35%OFF</strong></p></div>
  <div class="reveal">
    <a href="#" class="btn btn-line" onclick="handleLineClick(event)">LINEで予約・相談する</a>
    <a href="#" class="btn btn-web" onclick="handleWebClick(event)">WEBで予約する</a>
  </div>
  <div class="reveal" style="margin-top:30px">
    <div class="pricing-item"><span>クマ取り</span><span class="pricing-price">¥143,000〜</span></div>
    <div class="pricing-item"><span>眼瞼下垂</span><span class="pricing-price">¥107,000〜</span></div>
  </div>
</div>
<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
</body>
</html>
