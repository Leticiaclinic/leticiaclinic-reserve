  <script>
    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : '';
    }
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name) || '';
    }
    function safeFbq() { try { if (typeof fbq === 'function') fbq.apply(null, arguments); } catch(e) {} }

    function sendCAPIEvent(eventName, contentName) {
      try {
        var fbclid = getParam('fbclid');
        var fbp = getCookie('_fbp');
        var fbc = getCookie('_fbc') || (fbclid ? 'fb.1.' + Date.now() + '.' + fbclid : '');
        var payload = {
          event_name: eventName,
          event_time: Math.floor(Date.now() / 1000),
          event_source_url: window.location.href,
          action_source: 'website',
          content_name: contentName,
          user_data: { client_user_agent: navigator.userAgent, fbc: fbc, fbp: fbp, fbclid: fbclid }
        };
        var webhookUrl = 'https://hook.us2.make.com/3jvo4tgiqetar6onruly12a8asfmpjbz';
        fetch(webhookUrl, {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit', 
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(function(err) { console.warn('CAPI error:', err); });
      } catch(e) {}
    }

    function handleLineClick(e) {
      e.preventDefault();
      safeFbq('track', 'Lead', {content_name: 'LINE登録_モニターキャンペーン'});
      sendCAPIEvent('Lead', 'LINE登録_モニターキャンペーン');
      setTimeout(function() { window.location.href = 'https://liff.line.me/1657615313-pVn9wnwB?rid=161'; }, 400);
    }
    function handleWebClick(e) {
      e.preventDefault();
      safeFbq('track', 'Schedule', {content_name: 'WEB予約_モニターキャンペーン'});
      sendCAPIEvent('Schedule', 'WEB予約_モニターキャンペーン');
      setTimeout(function() { window.open('https://connect-app.net/r_leticia/reserve/main', '_blank', 'noopener'); }, 400);
    }
    document.addEventListener('DOMContentLoaded', function() { sendCAPIEvent('PageView', 'クッションページ閲覧'); });
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0908; --surface: #131110; --surface2: #1c1916; --gold: #c9a96e; --text: #f0ebe3; --text-muted: #8a7d6e; --border: rgba(201,169,110,0.18); --radius: 14px; }
    body { background: var(--bg); font-family: 'Noto Serif JP', serif; color: var(--text); overflow-x: hidden; }
    .hero { width: 100%; height: 46vh; position: relative; overflow: hidden; }
    .hero-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75); }
    .hero-content { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); text-align: center; padding: 0 20px; }
    .hero-en { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--gold); }
    .main { max-width: 500px; margin: 0 auto; padding: 20px; }
    .campaign-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; text-align: center; margin-bottom: 24px; }
    
    /* ボタンの修正 */
    .btn { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; padding: 14px 16px; border-radius: var(--radius); text-decoration: none; margin-bottom: 12px; font-weight: 500; transition: 0.3s; }
    .btn-icon-wrap { position: absolute; left: 16px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .btn-body { text-align: center; }
    .btn-sub { font-size: 9px; display: block; opacity: 0.8; }
    .btn-main { font-size: 14px; display: block; }
    .btn-line { background: #06c755; color: #fff; }
    .btn-web { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    
    .pricing-item { display: flex; justify-content: space-between; padding: 12px; background: var(--surface); border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(201,169,110,0.08); }
    .reveal { opacity: 0; transform: translateY(20px); transition: 0.8s; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
<div class="hero">
  <img src="https://leticiaclinic.github.io/leticiaclinic-reserve/11.jpg" class="hero-img">
  <div class="hero-content"><p class="hero-en">Leticia Clinic</p></div>
</div>
<div class="main">
  <div class="campaign-card reveal"><p>美容外科医歴25年の治療が<br><strong style="color:var(--gold)">最大35%OFF</strong></p></div>
  <div class="reveal">
    <a href="#" class="btn btn-line" onclick="handleLineClick(event)">
      <div class="btn-icon-wrap"><svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.07 2 11.08c0 3.25 2.14 6.13 5.4 7.74-.21.77-.73 2.94-.83 3.39-.1.49.03.5.21.37.18-.13 2.3-1.6 3.23-2.25.22.03.45.05.68.05 5.52 0 10-4.07 10-9.08S17.52 2 12 2z"/></svg></div>
      <div class="btn-body"><span class="btn-sub">推奨 — LINE限定クーポン</span><span class="btn-main">LINEで予約・相談する</span></div>
    </a>
    <a href="#" class="btn btn-web" onclick="handleWebClick(event)">
      <div class="btn-icon-wrap"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></div>
      <div class="btn-body"><span class="btn-sub">24時間いつでも受付</span><span class="btn-main">WEBで予約する</span></div>
    </a>
  </div>
</div>
<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
</body>
</html>
